; agent_phone_tool — servo key hand firmware
; Same serial protocol on ESP32-S3 / STM32F103 / AVR Nano.

; ---------------------------------------------------------------------------
; 通用 ESP32-S3 DevKit（USB CDC）
; ---------------------------------------------------------------------------
[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_protocol = esptool
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
lib_deps = arduino-libraries/Servo@^1.2.1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSERVO_PIN_VOLUP=4
  -DSERVO_PIN_VOLDOWN=5
  -DSERVO_PIN_POWER=9
lib_ldf_mode = deep+

[env:esp32_s3_nano]
extends = env:esp32_s3

; ---------------------------------------------------------------------------
; DFRobot FireBeetle 2 ESP32-S3 V1.0（与 innox_echo/hardware/echo-esp32 同板）
; 顶面丝印：Vol+=A2 Vol-=A1 Power=A0（用户接线：原 A0/A2 对调）
;   GPIO：A0=4 A1=5 A2=6
; USB CDC：303A:1001 / 303A:83CF / DFRobot 3343:83CF
; 烧录参考：/mnt/data/innox_echo/hardware/echo-esp32/flash.sh
; ---------------------------------------------------------------------------
[env:firebeetle2_esp32s3]
platform = espressif32@6.13.0
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps = arduino-libraries/Servo@^1.2.1
lib_ldf_mode = deep+
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DAGENT_PHONE_BOARD_FIREBEETLE2=1
  -DSERVO_PIN_VOLUP=A2
  -DSERVO_PIN_VOLDOWN=A1
  -DSERVO_PIN_POWER=A0

; ---------------------------------------------------------------------------
; STM32F103 Blue Pill（Arduino 名 A4/A5/A6 = PA4/PA5/PA6）
; Vol+ = A4, Vol- = A5, Power = A6
; 串口：USB-UART（常见 CH340 1a86:55d3）接 USART1 TX/RX；或 ST-Link
; 上传：默认 serial bootloader；有 ST-Link 时改 upload_protocol = stlink
; ---------------------------------------------------------------------------
[env:stm32f103_bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
; 按实际改口；也可用: pio run -e stm32f103_bluepill -t upload --upload-port /dev/ttyACM0
upload_protocol = serial
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; 使用 STM32duino 自带 Servo（勿拉 arduino-libraries/Servo，F1 支持差）
build_flags =
  -DAGENT_PHONE_BOARD_STM32=1
  -DSERVO_PIN_VOLUP=PA4
  -DSERVO_PIN_VOLDOWN=PA5
  -DSERVO_PIN_POWER=PA6

; 同引脚，ST-Link SWD 烧录
[env:stm32f103_bluepill_stlink]
extends = env:stm32f103_bluepill
upload_protocol = stlink
upload_port =

; ---------------------------------------------------------------------------
; 旧板：Arduino Nano 3 (ATmega328P)
; ---------------------------------------------------------------------------
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.1
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.1
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
