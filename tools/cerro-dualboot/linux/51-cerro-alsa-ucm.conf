# WirePlumber 0.5 style fragment for Cerro UCM HiFi
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.acp.auto-profile = true
        api.acp.auto-port = true
        device.profile = "HiFi"
      }
    }
  }
]
